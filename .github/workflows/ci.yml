name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài dependency
        run: pip install -r requirements.txt

      - name: Chạy pytest (bỏ test_cp5 cần deploy sống & test_bonus_cicd tự tham chiếu)
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: fake://
        run: pytest tests/test_cp1.py tests/test_cp2.py tests/test_cp3.py tests/test_cp4.py --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -m "not docker"

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t day12-agent:ci .

  deploy:
    name: Deploy lên Render
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Kích hoạt Render Deploy Hook
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" > /dev/null

      - name: Smoke test sau deploy
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          sleep 60
          curl -fsS "$PUBLIC_URL/health"